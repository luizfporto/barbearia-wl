<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- TROQUE PELO NOME DA BARBEARIA DO SEU AMIGO -->
  <title>Agendamento - Barbearia</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h2 { text-align: center; color: #f39c12; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #333;
      box-sizing: border-box;
    }
    input, select { background: #2a2a2a; color: #fff; }
    button {
      background: #f39c12;
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #e67e22; }
    .price { font-size: 1.2em; color: #2ecc71; text-align: center; margin-top: 10px; font-weight: bold; }
    footer { text-align: center; margin-top: 25px; font-size: 12px; color: #888; }
  </style>

  <!-- SDK do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <!-- NOME DA BARBEARIA -->
    <!-- LOGO E NOME DA BARBEARIA -->
<div style="text-align: center; margin-bottom: 15px;">
  <!-- LOGO BARBEARIA WL -->
<div style="text-align: center; margin-bottom: 20px;">
  <svg width="180" height="180" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Círculo e Borda Externa -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="#d4af37" stroke-width="3"/>
    <circle cx="100" cy="100" r="88" fill="none" stroke="#d4af37" stroke-width="1.5"/>
    
    <!-- Textos do Topo -->
    <path id="curve" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
    <text fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="3">
      <textPath href="#curve" startOffset="50%" text-anchor="middle">
        BARBEARIA
      </textPath>
    </text>
    
    <text x="50" y="68" fill="#d4af37" font-family="Arial, sans-serif" font-size="8" font-weight="bold">DESDE</text>
    <text x="132" y="68" fill="#d4af37" font-family="Arial, sans-serif" font-size="8" font-weight="bold">2017</text>
    
    <!-- Letras WL Prateadas -->
    <text x="100" y="118" fill="url(#silverGradient)" font-family="'Times New Roman', serif" font-size="52" font-weight="bold" text-anchor="middle" letter-spacing="-2">WL</text>
    
    <!-- Ícone Barber Pole central -->
    <rect x="96" y="124" width="8" height="20" rx="4" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
    <path d="M96 128 L104 132 M96 134 L104 138 M96 140 L104 144" stroke="#ff0000" stroke-width="2"/>
    
    <!-- Tesoura e Navalha (Detalhes em Bronze) -->
    <path d="M 70 135 L 85 135 M 68 132 L 87 138" stroke="#d4af37" stroke-width="2"/>
    <path d="M 115 135 L 130 135 M 113 138 L 132 132" stroke="#d4af37" stroke-width="2"/>
    
    <!-- WhatsApp e Contatos -->
    <text x="100" y="162" fill="#ffffff" font-family="Arial, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">
      11 98792-6345
    </text>
    <text x="100" y="174" fill="#d4af37" font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
      @WELITON_BARBEARIA_2017
    </text>
    
    <!-- Gradiente Prateado para as Letras -->
    <defs>
      <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="50%" stop-color="#b0b0b0"/>
        <stop offset="100%" stop-color="#e0e0e0"/>
      </linearGradient>
    </defs>
  </svg>
</div>
</div>
<h2>Barbearia WL</h2>

    <form id="formAgendamento">
      <label for="servico">Escolha o Serviço:</label>
      <select id="servico" onchange="atualizarPreco()" required>
        <option value="">-- Selecione --</option>
        <option value="Cabelo" data-preco="35.00">Corte Masculino - R$ 35,00</option>
        <option value="Barba" data-preco="25.00">Barba Completa - R$ 25,00</option>
        <option value="Combo Cabelo + Barba" data-preco="50.00">Combo Cabelo + Barba - R$ 50,00</option>
      </select>

      <div class="price" id="exibirTotal">Total: R$ 0,00</div>

      <label for="nome">Seu Nome:</label>
      <input type="text" id="nome" placeholder="Digite seu nome completo" required>

      <label for="whatsapp">Seu WhatsApp:</label>
      <input type="tel" id="whatsapp" placeholder="(00) 00000-0000" required>

      <label for="horario">Escolha o Horário:</label>
<select id="horario" required>
  <option value="">-- Selecione o Horário --</option>
  <option value="09:00">09:00</option>
  <option value="10:00">10:00</option>
  <option value="11:00">11:00</option>
  <option value="13:00">13:00</option>
  <option value="14:00">14:00</option>
  <option value="15:00">15:00</option>
  <option value="16:00">16:00</option>
  <option value="17:00">17:00</option>
  <option value="18:00">18:00</option>
  <option value="19:00">19:00</option>
</select>

      <button type="submit">Confirmar Agendamento</button>
    </form>

    <footer>
      <p>&copy; 2026 Luiz Porto &reg; — Desenvolvido sob medida.</p>
    </footer>
  </div>

  <script>
    // COLE SUAS CREDENCIAIS DO SUPABASE AQUI:
    const SUPABASE_URL = "https://eyckgldebwinlduqtxtj.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3FU7UctDj25K-nYT5AkyJw_fqw-_fDL";
    
    // WHATSAPP DO DONO (apenas números com DDD, ex: 5511999999999)
    const WHATSAPP_BARBEARIA = "5511999999999";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function atualizarPreco() {
      const select = document.getElementById('servico');
      const opcaoSelecionada = select.options[select.selectedIndex];
      const preco = opcaoSelecionada.getAttribute('data-preco') || '0.00';
      document.getElementById('exibirTotal').innerText = `Total: R$ ${parseFloat(preco).toFixed(2).replace('.', ',')}`;
    }

    document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
      e.preventDefault();

      const servico = document.getElementById('servico').value;
      const nome = document.getElementById('nome').value;
      const whatsapp = document.getElementById('whatsapp').value;
      const horario = document.getElementById('horario').value;

      // Salva na tabela nova: agendamentos_amigo
      const { data, error } = await supabaseClient
        .from('agendamentos_wl')
        .insert([{ nome_cliente: nome, whatsapp: whatsapp, servico: servico, horario: horario }]);

      if (error) {
        alert('Erro ao agendar: ' + error.message);
      } else {
        alert('Agendamento salvo! Redirecionando para o WhatsApp...');

        const mensagem = `*Novo Agendamento!* 💈%0A%0A` +
                         `*Cliente:* ${nome}%0A` +
                         `*Serviço:* ${servico}%0A` +
                         `*Horário:* ${horario}%0A` +
                         `*Contato:* ${whatsapp}`;

        const linkWhatsapp = `https://wa.me/${WHATSAPP_BARBEARIA}?text=${mensagem}`;

        document.getElementById('formAgendamento').reset();
        document.getElementById('exibirTotal').innerText = 'Total: R$ 0,00';
        
        window.open(linkWhatsapp, '_blank');
      }
    });
  </script>
</body>
</html>
